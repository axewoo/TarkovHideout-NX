name: Build NRO

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Bundle current hideout data
        # The app downloads fresh data on its own, so a tarkov.dev outage only
        # means the NRO ships without an offline copy.
        run: python3 tools/build_data.py romfs || echo "::warning::tarkov.dev unreachable, NRO ships without bundled data"

      - name: Build
        run: make -j$(nproc)

      - uses: actions/upload-artifact@v4
        with:
          name: TarkovHideout
          path: TarkovHideout.nro

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TarkovHideout.nro
