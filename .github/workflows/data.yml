name: Update hideout data

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
  push:
    paths: [tools/**, .github/workflows/data.yml]

permissions:
  contents: write

# One run at a time: parallel runs hit the wiki's rate limit and race on the data branch.
concurrency:
  group: data
  cancel-in-progress: true

jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tools
        run: |
          sudo apt-get install -y -q libcairo2 >/dev/null
          pip install -q pillow cairosvg

      - name: Probe upstream data shapes
        continue-on-error: true
        run: python tools/probe.py

      - name: Reuse the previous map renders and wiki pictures
        # Daily runs keep the map pieces and pictures already published (the build skips files that exist),
        # so they finish quickly and push identical files. Changes to the tools rebuild everything.
        if: github.event_name != 'push'
        continue-on-error: true
        run: |
          git clone -q --depth 1 -b data "https://github.com/${{ github.repository }}" prev
          mkdir -p out/maps
          for d in prev/maps/*/; do [ -f "$d/meta.json" ] && cp -r "$d" out/maps/; done
          [ -d prev/wiki ] && cp -r prev/wiki out/
          [ -d prev/traders ] && cp -r prev/traders out/
          [ -d prev/guns ] && cp -r prev/guns out/
          rm -rf prev
          du -sh out

      - name: Build compact data from tarkov.dev
        run: python tools/build_data.py out --assets

      - name: Publish to the data branch
        # The app reads raw.githubusercontent.com/<repo>/data/{hideout,maps}-<mode>.json,
        # db-<mode>.json, wiki.json, icons-<page>.jpg and maps/*.jpg.
        # Each run replaces the branch so it never accumulates history.
        run: |
          cd out
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.json icons-*.jpg maps $(ls -d wiki traders guns 2>/dev/null)
          git commit -qm "Hideout data $(date -u +%F)"
          du -sh maps wiki 2>/dev/null; git count-objects -vH
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" data
