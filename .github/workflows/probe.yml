name: Probe gun data
on:
  push:
    branches: [claude/gun-builder]
    paths: [.github/probe/**, .github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/probe/guns.py
